# =============================================================================
# Render Blueprint — one-click-ish preview deploy of AI Creator Hub.
#
# Provisions the whole stack on Render's free tier: managed Postgres + Key Value
# (Redis), the NestJS API, the BullMQ worker, and the Next.js web app. HTTPS is
# automatic on *.onrender.com, which the secure session cookie requires.
#
# The browser only ever talks to the WEB origin: the web app proxies /api/* to
# the API server-side (apps/web/app/api/[...path]/route.ts), so the SameSite=Lax
# session cookie stays first-party. That's why API_INTERNAL_URL below points the
# web service at the API's URL.
#
# Providers run on deterministic MOCKS by default (no S3 / no vendor keys needed)
# — sign up, spend credits, run jobs, see results end-to-end. Add ANTHROPIC_API_KEY
# to the API + worker to make the text tools generate with real Claude.
#
# Deploy:  push this file, then in Render → "New +" → "Blueprint" → pick this repo.
# After the first deploy, set APP_URL + API_INTERNAL_URL to the real web/api URLs
# (see docs/PREVIEW_DEPLOY.md) and trigger a redeploy.
# =============================================================================

databases:
  - name: hub-postgres
    plan: free
    databaseName: creatorhub
    user: hub

services:
  # ---- Redis (BullMQ queues + session cache) --------------------------------
  - type: keyvalue
    name: hub-redis
    plan: free
    ipAllowList: [] # reachable only from other Render services in this project
    maxmemoryPolicy: noeviction

  # ---- API (NestJS) ---------------------------------------------------------
  - type: web
    name: hub-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Start script applies the schema (with retries, non-blocking) and runs BOTH
    # the API and the BullMQ worker in this one container — Render's free tier has
    # no separate background-worker service type, so we co-locate them here. The
    # API holds the port so the deploy health check passes.
    dockerCommand: sh infra/scripts/start-api.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      - key: DATABASE_URL
        fromDatabase:
          name: hub-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hub-redis
          type: keyvalue
          property: connectionString
      # Signs session JWTs + derives the TOTP encryption key. Auto-generated once.
      - key: AUTH_SECRET
        generateValue: true
      # Public web origin — only used for CORS + email links. NOT required: the
      # browser talks to the API through the same-origin web proxy, so CORS never
      # fires, and preview email links just log to these logs. Optionally set it
      # to the hub-web URL later for correct email links.
      - key: APP_URL
        sync: false
      # Optional: real Claude for the text tools. Add in the dashboard to enable.
      - key: ANTHROPIC_API_KEY
        sync: false

  # NOTE: The BullMQ worker is NOT a separate service — Render's free tier has no
  # background-worker type. It runs inside hub-api (see infra/scripts/start-api.sh).
  # To scale it out later, add a `type: worker` service on a paid plan using
  # infra/docker/worker.Dockerfile and drop the worker launch from the start script.

  # ---- Web (Next.js) --------------------------------------------------------
  - type: web
    name: hub-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      # Server-side proxy target (browser never sees this). Auto-wired from the
      # API service's hostname — no manual paste. The proxy adds https:// to this
      # bare host (apps/web/app/api/[...path]/route.ts).
      - key: API_INTERNAL_URL
        fromService:
          name: hub-api
          type: web
          property: host
