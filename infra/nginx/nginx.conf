# Reverse proxy for production (behind Cloudflare). Terminates one public origin
# and routes /api to the NestJS service and everything else to Next.js. This is
# where TLS, gzip, and upstream timeouts live (Architecture §3 edge layer).
# Large uploads bypass this proxy entirely via presigned S3 URLs (§4.5), so the
# body size limit here only needs to cover normal API traffic.
worker_processes auto;

events { worker_connections 1024; }

http {
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
  client_max_body_size 10m;

  upstream web { server web:3000; }
  upstream api { server api:4000; }

  server {
    listen 80;
    server_name _;

    # API traffic. Longer read timeout for SSE streaming responses (§7).
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      proxy_read_timeout 300s;
      proxy_buffering off; # allow token streaming to flush immediately
    }

    # Everything else → Next.js.
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
