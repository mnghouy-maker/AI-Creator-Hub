# Production stack — the whole platform behind one Nginx origin.
# Bring up with:  docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
#
# Topology (Architecture §3): Nginx terminates one origin and routes /api to the
# NestJS service and everything else to Next.js. The worker runs the AI jobs off
# the same Redis queues. A one-off `migrate` service applies Prisma migrations
# before the API/worker start, so schema changes ship with the deploy.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
      POSTGRES_DB: ${POSTGRES_DB:-creatorhub}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hub}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio:/data

  # One-off: apply migrations, then exit. API/worker wait for it to complete.
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', '--filter', '@hub/db', 'migrate:deploy']
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file: [../.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: [../.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    env_file: [../.env]
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, api]

volumes:
  pg:
  redis:
  minio:
